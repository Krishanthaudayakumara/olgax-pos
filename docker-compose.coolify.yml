# docker-compose.coolify.yml
#
# Use this file when deploying via Coolify (or any other reverse-proxy platform
# such as Traefik, Portainer with a proxy, etc.).
#
# Coolify's built-in Caddy proxy routes traffic to containers via the internal
# Docker network — it does NOT need services to bind ports on the host.
# Leaving host ports bound (e.g. 3000:3000) will cause deployment failures if
# another service already occupies that port on the same server.
#
# In Coolify, set your "Docker Compose Filename" to docker-compose.coolify.yml,
# OR configure it to merge both files with:
#   docker compose -f docker-compose.yml -f docker-compose.coolify.yml up -d
#
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: olgax_pos

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/olgax_pos?schema=public"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-change_me_in_production}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-}"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
